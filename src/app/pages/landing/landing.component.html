<!-- Fluid Background Canvas -->
<canvas id="fluid"></canvas>

<div class="landing-page">
    <!-- Header -->
    <header class="landing-header">
        <p class="greeting-text">Hey, I'm <span class="name-highlight">Jana :D</span></p>
    </header>

    <!-- Memoji Section -->
    <div class="memoji-section">
        <div class="memoji-wrapper">
            <img src="avatar.png" alt="Avatar" class="memoji memoji-default" />
            <img src="avatar-hover.png" alt="Avatar looking at you" class="memoji memoji-hover" />
        </div>
    </div>

    <!-- Input Section -->
    <div class="input-section">
        <div class="input-wrapper">
            <input type="text" placeholder="Ask me anything..." [(ngModel)]="userInput" (keyup.enter)="onSubmit()" />
            <button class="send-btn" (click)="onSubmit()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Suggestion Pills -->
    <nav class="suggestion-nav">
        @for (pill of navPills; track pill.label) {
        <button class="nav-pill" [class]="'nav-pill ' + pill.class" (click)="navigateToChat(pill.message)">
            @switch (pill.icon) {
            @case ('smile') {
            <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M8 14s1.5 2 4 2 4-2 4-2" />
                <line x1="9" y1="9" x2="9.01" y2="9" />
                <line x1="15" y1="9" x2="15.01" y2="9" />
            </svg>
            }
            @case ('briefcase') {
            <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
            </svg>
            }
            @case ('layers') {
            <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 2 7 12 12 22 7 12 2" />
                <polyline points="2 17 12 22 22 17" />
                <polyline points="2 12 12 17 22 12" />
            </svg>
            }
            @case ('party') {
            <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M5.8 11.3 2 22l10.7-3.79" />
                <path d="M4 3h.01" />
                <path d="M22 8h.01" />
                <path d="M15 2h.01" />
                <path d="M22 20h.01" />
                <path
                    d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12v0c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10" />
                <path d="m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11v0c-.11.7-.72 1.22-1.43 1.22H17" />
                <path d="m11 2 .33.82c.34.86-.2 1.82-1.11 1.98v0C9.52 4.9 9 5.52 9 6.23V7" />
                <path
                    d="M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2Z" />
            </svg>
            }
            @case ('search') {
            <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="10" cy="7" r="4" />
                <path d="M10.3 15H7a4 4 0 0 0-4 4v2" />
                <circle cx="17" cy="17" r="3" />
                <path d="m21 21-1.9-1.9" />
            </svg>
            }
            }
            <span class="pill-label">{{ pill.label }}</span>
        </button>
        }
    </nav>
</div>
